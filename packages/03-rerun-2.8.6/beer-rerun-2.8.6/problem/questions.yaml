questions:
  - id: Q1
    title: "50 维感官评分的可复核代理（mapped grade）预测"
    objective: "用 1.csv 的 231 个化合物/理化特征预测 4.csv 的 50 维感官目标；原始 0–6 不可识别，交付显式 mapped grade。"
    inputs:
      - "1.csv 231 特征"
      - "4.csv 50 维目标"
      - "SPLIT-0002（评估）；SPLIT-0001（仅映射参数估计）"
    outputs:
      - "predictions.csv（50 维）"
      - "MAE/R²"
      - "误差分层图"
    constraints:
      - "映射参数只用训练集"
      - "不得用 4/5/6/7/8.xlsx MDI/SHAP 作特征"
      - "混合尺度逐列处理"
    evaluation: "50 维等权 MAE（uniform-average）；另报逐维 MAE 与 OOF"
    metric: mae
    needsData: true
    needsBaseline: true
  - id: Q2
    title: "化合物–风味 Top-3 与稳定性"
    objective: "对 50 个感官维度给出 Top-3 关键化合物，并用 bootstrap 与方法间 Jaccard 量化稳定性。"
    inputs:
      - "1.csv 231 特征"
      - "2.csv 相关矩阵"
      - "4.csv 50 维目标"
      - "SPLIT-0001 的 train 行"
    outputs:
      - "sets.json（每维 Top-3）"
      - "Jaccard/入选频率"
      - "候选簇"
    constraints:
      - "2.csv 先 PSD 投影"
      - "只做同期关联，不宣称因果"
      - "5/6/7.csv 不是独立外部验证"
    evaluation: "方法间 Top-3 Jaccard + bootstrap 入选频率"
    metric: topk-jaccard
    needsData: true
    needsBaseline: true
  - id: Q3
    title: "风格条件生成与跨风格迁移"
    objective: "以 tasting_category_fine 为条件学习生成模型；Tripel/Kriek/Lambic 整类留出；跨风格迁移时缺陷不恶化。"
    inputs:
      - "1.csv 231 特征"
      - "风格标签"
      - "8.xlsx 缺陷阈值"
    outputs:
      - "生成/迁移谱"
      - "能量距离"
      - "缺陷超阈值率"
      - "感官画像"
    constraints:
      - "风格整类留出，不得随机划分冒充"
      - "缺陷列不平移"
      - "结论只写生成合理性/约束满足，不写真实酿造验证"
    evaluation: "能量距离 + 缺陷不恶化 + 约束满足"
    metric: constraint-satisfaction
    needsData: true
    needsBaseline: true
