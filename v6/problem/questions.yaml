questions:
  - id: Q1
    title: "数据缺失条件下的感官评分：图正则低秩多输出预测与有界相对分级"
    objective: "以 1.csv 的 231 个化学及理化变量为输入，预测 4.csv 的 50 个标准化感官标签 Y，并把预测强度按训练折内经验中点分布映射为 0–6 相对分级；在训练折内处理 73 个真实缺失值（中位数填补+缺失指示），用图正则低秩多输出回归捕捉共享结构与变量网络，并在 3 次重复 × 3 外折、外折内再 3 折的内部重验证协议下给出 Aroma/Flavour 30 项与全 50 维的 OOF 指标。本问不含任何留出集承诺：4.csv 全部 250 行都进入内部重验证。"
    inputs:
      - "data/clean/q1_mapped.csv（250 行：beer 键 + 231 化学/理化特征 + 50 维 4.csv 感官标签 + 训练折派生的 0–6 分级参考列）"
      - "data/splits/NESTED-CV-1/splits.csv（不可变划分清单：repeat × outer fold × inner fold × row）"
      - "data/clean/q2_raw.csv（DATA-0001 父版本，提供 2.csv 网络与 4.csv 原始目标）"
      - "analysis/sensory/targetcolumns.csv（231 特征 / 50 目标 / 37-33-161 尺度分组常量）"
    outputs:
      - "predictions.csv（每行 repeat/fold/row + 50 个 y_pred__<目标列>，共 750 行）"
      - "oof_long.csv（逐行 OOF 明细，用于独立重算）"
      - "metrics.json（mae 等有限数值指标）"
      - "outputs.json（逐维 MAE/R²/Skill、Aroma15/Flavour15/Other20 分组、逐风格结果、9 项消融表中的 1–3 项）"
      - "figures/q1_*.png"
    constraints:
      - "插补中位数、标准化、Rank-Gauss 参照分布、低秩与图正则超参数、分级参考分布都只在训练折内拟合（外折训练集内再做内层 3 折选参）"
      - "禁止把 4.csv 目标、7.csv 感官侧数据、5/6.csv 相关矩阵或 8.xlsx 的 GBM importance/SHAP 作为特征"
      - "0–6 分级必须显式声明为相对感官强度等级，等级 0 不代表风味不存在，等级 6 不代表人工评分满分"
      - "缺失指示变量不连接到化学图（图惩罚块置零）"
      - "本轮不执行 HGB 与任何单次 20% 留出评估；旧 SPLIT-0002 结果只作历史，不参与本轮比较"
    evaluation: "主指标：Aroma/Flavour 30 项（Aroma15 + Flavour15）等权 OOF MAE（metricKey=mae，值为 3 次重复池化后 750 行 OOF 的逐行平均绝对误差）。协议：3 次重复 × 3 外折、外折内再 3 折的内部重验证（种子 20261025-27，按 tasting_category_fine 分层，外层测试折从不出现在内层选参与预处理拟合中）。副指标：全 50 维 MAE、Aroma15/Flavour15/Other20 分组 MAE、逐维 MAE/R²/Skill、逐风格 MAE、宏平均 R²、以及 0–6 相对分级的二次加权 kappa 与分级 MAE。候选集合与对照固定为：训练中位数基线、真普通 Ridge（γ=0, r=50）、图 Ridge（γ>0）、图正则低秩（r 内层选参）；不因结果好坏增删对照。"
    metric: mae
    needsData: true
    needsBaseline: true

  - id: Q2
    title: "化合物–风味分析：共表达网络、风格混杂分析与稳定 Top-3"
    objective: "利用 2.csv 的 231×231 Spearman 相关矩阵与 1.csv 训练行构建化合物共表达图，在 4.csv 的 50 个感官维度上分别给出 Top-3 关键单体化合物；用总体 Spearman、风格内残差化 Spearman、图正则低秩回归系数与 bootstrap 综合排名四种方法计算方法间 Top-3 Jaccard，并用 500 次风格分层 bootstrap 报告入选频率、方向、模块与风格混杂证据。本问是固定训练集上的重复重采样研究，不是交叉验证、也不产生逐行 OOF。"
    inputs:
      - "data/clean/q2_raw.csv（DATA-0001：250 行 231 特征 + 50 原始感官目标）"
      - "data/splits/SPLIT-0001/train.csv（固定 200 行训练集，用于拟合与关联分析）"
      - "data/raw/2.csv（附件提供的化合物共表达矩阵，PSD 投影后使用）"
      - "data/clean/q2_chem_meta.json（变量类型/尺度/证据等级）"
      - "data/processed/sensory_name_alignment.csv（与 data/raw/6.csv 做名称对齐所用的对照表，字节同源副本）"
    outputs:
      - "sets.json（50 维 × 4 方法的 Top-3 集合，作为 topk-jaccard 证据）"
      - "candidate_scores.csv（231 × 50 的候选强度矩阵，用于独立重算与宇宙划分）"
      - "bootstrap_pi.csv（500 × 50 × 4 × 3 的 bootstrap 轨迹，用于独立重算 π）"
      - "strict_top3.csv / extended_top3.csv（严格单体化合物榜与扩展榜分表）"
      - "metrics.json（topk-jaccard 必须含）"
      - "outputs.json（bootstrap 入选频率、Top-3 名单、方向/模块/风格混杂、9 项消融表第 4 项）"
      - "figures/q2_*.png"
    constraints:
      - "2.csv 必须先做 PSD 投影再定义阈值边权；bootstrap 每次重拟合预处理与网络"
      - "严格榜只允许 216 个单体化合物；3 个元素/指标项与 7 个理化参数、5 个派生汇总量另列扩展榜，不得混入严格榜"
      - "5/6/7/8.xlsx 只作非独立外部佐证，不得参与 Top-3 选择"
      - "只声明同期关联，不宣称因果或未来预测；50 维×4 方法×3 重复的入选频率与符号一致性必须如实报告，不得只报最优方法"
      - "协议不得表述为嵌套交叉验证：无 outer/inner 折、无逐行 OOF，50 行测试样本未参与任何计算"
    evaluation: "主指标：50 维 × 4 方法（total_spearman / within_style_spearman / graph_lowrank / consensus）的 Top-3 平均两两 Jaccard（metricKey=topk-jaccard，3 次重复池化）。副指标与必需披露：每次 500 次风格内分层 bootstrap 的各方法入选频率 π 与符号一致性、跨重复一致率、严格榜与扩展榜分表（严格榜 216 个单体化合物、扩展榜 15 项）、类别字典（单体/元素指标/理化/派生和）与替代候选清单、以及与 data/raw/6.csv 的**同源排序对照**（对齐后 Spearman 均值；6.csv 为同源参考表，不是独立外部验证，也不参与选择）。"
    metric: topk-jaccard
    needsData: true
    needsBaseline: true

  - id: Q3
    title: "风格条件生成与跨风格迁移：分层收缩边际、混合 Copula 与约束优化"
    objective: "以 tasting_category_fine 为条件，用风格内经验边际 + 池化边际的层次收缩与风格间相关收缩 Copula 学习 p(X|s)，在给定风格下生成化合物谱并给出感官画像；实现 Pils/Lager→Tripel 的分位数映射初始化与最小改动 QP 约束迁移，硬性要求 DMS、双乙酰、4VG、trans-2-nonenal 等缺陷列不恶化（以化学列实测为准，stale hops 只能是训练内代理约束，须显式标注），并如实报告约束核验状态、能量距离、多样性与迁移分层成功口径。"
    inputs:
      - "data/clean/q3.csv（250 行：231 特征 + tasting_category_fine 风格 + 缺陷/阈值相关列）"
      - "data/clean/q3_thresholds.json（8.xlsx Sensory thresholds：均值/中位数阈值与缺陷列）"
      - "data/clean/q3_style_protocol.json（风格整类留出与阈值协议）"
      - "data/clean/q1_mapped.csv（作为 Q1 感官预测代理的只读推理输入）"
    outputs:
      - "samples.csv（生成化合物谱，含约束列，作为 constraint-satisfaction 证据）"
      - "constraints.csv（逐条约束记录：verified / conditional / not_identifiable / infeasible 与残差）"
      - "q3_metrics.csv（逐格能量/多样性明细，用于独立重算与加权重算）"
      - "run-seed-<seed>.json（每个随机种子一份运行证据）"
      - "transfers.csv + solver_certificates.jsonl（迁移四策略逐行结果与 QP 证书）"
      - "metrics.json（constraint-satisfaction、energy-distance、diversity、transfer 指标）"
      - "outputs.json（迁移前后谱/OAV、对照策略、9 项消融表第 5–9 项）"
      - "figures/q3_*.png"
    constraints:
      - "风格整类留出（Tripel/Kriek/Lambic）不得用随机划分冒充；小类必须报告样本量与不确定度"
      - "缺陷约束是硬可行域约束，不是事后筛选；投影产生的边界夹断必须逐项披露，不得当作质量证据"
      - "4.csv 不参与生成模型训练，仅用于感官画像一致性评估；Q1 代理只做推理"
      - "约束核验必须区分 verified / conditional / not_identifiable / infeasible，未核验比例不得省略"
      - "censor 地板码行必须披露（该行“≤阈值”近乎空转）；不可估格与不可行解必须如实列出，不得隐藏"
    evaluation: "主指标分成两个互补口径：(a) 生成侧 constraint-satisfaction（同时满足全部声明约束的样本比例，须同时声明它由投影循环保证、并披露边界夹断规模与未核验比例）与**归一化经验能量距离**（经验 V，按 n_gen 加权池化，并给出同风格训练行重采样参照与有符号 U）；(b) 迁移侧按策略分层的成功口径——逐化学列不增率（必须给出什么都不做的 source-fixed 对照）、QP 求解状态与原始/对偶残差、归一化与原始能量 V、目标均值自距（PCA 中心化后）。副指标：多样性（最近邻距离）、精确复制率、t2n 感官代理不增率与越风格上界行数、视觉/失效披露。"
    metric: constraint-satisfaction
    needsData: true
    needsBaseline: true
